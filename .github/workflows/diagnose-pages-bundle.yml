name: Diagnose pages bundle (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live index.html
        run: |
          curl -sS -i "https://seedcreativeworks-onthegrid.github.io/northstar-starnorth/" -o /tmp/index.html -D /tmp/index.headers
          echo "--- headers ---"
          cat /tmp/index.headers
          echo "--- body (script tags) ---"
          grep -o '<script[^>]*src="[^"]*"' /tmp/index.html || true
      - name: Fetch and grep the main JS bundle for the Vercel API base URL
        run: |
          SRC=$(grep -oE 'src="[^"]*index-[^"]*\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"$//')
          echo "Resolved script src: $SRC"
          if [[ "$SRC" == /* ]]; then
            URL="https://seedcreativeworks-onthegrid.github.io${SRC}"
          else
            URL="https://seedcreativeworks-onthegrid.github.io/northstar-starnorth/${SRC}"
          fi
          echo "Fetching: $URL"
          curl -sS -i "$URL" -o /tmp/bundle.js -D /tmp/bundle.headers
          echo "--- bundle headers ---"
          cat /tmp/bundle.headers
          echo "--- occurrences of vercel.app in bundle ---"
          grep -o 'https://[a-zA-Z0-9.-]*vercel[a-zA-Z0-9.-]*' /tmp/bundle.js | sort -u || echo "NONE FOUND"
          echo "--- bundle size ---"
          wc -c /tmp/bundle.js
