name: Diagnose login (temporary)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live GitHub Pages index.html and inspect the referenced JS bundle
        run: |
          set -x
          curl -sS "https://seedcreativeworks-onthegrid.github.io/northstar-starnorth/" -o index.html
          echo "--- index.html asset references ---"
          grep -o '/northstar-starnorth/assets/[^"]*' index.html
          JS_PATH=$(grep -o '/northstar-starnorth/assets/index-[^"]*\.js' index.html | head -1)
          echo "JS bundle path: $JS_PATH"
          curl -sS "https://seedcreativeworks-onthegrid.github.io${JS_PATH}" -o bundle.js
          echo "--- does the live bundle contain the Vercel API base URL? ---"
          grep -c "northstar-business-dashboard.vercel.app" bundle.js || echo "NOT FOUND"
          echo "--- last-modified / cache headers on the live index.html ---"
          curl -sS -I "https://seedcreativeworks-onthegrid.github.io/northstar-starnorth/"
