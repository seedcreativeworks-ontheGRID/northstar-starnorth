name: Verify login fix (temporary)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live index.html and resolve the current JS bundle
        run: |
          curl -sS "https://seedcreativeworks-onthegrid.github.io/northstar-starnorth/" -o /tmp/index.html
          SRC=$(grep -oE 'src="[^"]*index-[^"]*\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"$//')
          echo "Bundle: $SRC"
          curl -sS "https://seedcreativeworks-onthegrid.github.io${SRC}" -o /tmp/bundle.js
          echo "--- last-modified ---"
          curl -sS -I "https://seedcreativeworks-onthegrid.github.io${SRC}" | grep -i last-modified
      - name: Confirm the auth calls resolve against the Vercel base URL
        run: |
          echo "--- searching for the resolveApiUrl pattern (API_BASE_URL prefixed onto /api paths) ---"
          grep -o '.\{60\}northstar-business-dashboard.vercel.app.\{60\}' /tmp/bundle.js || echo "NOT FOUND"
          echo "--- confirming credentials:'same-origin' no longer hardcoded next to /api/auth/login ---"
          grep -o '.\{80\}/api/auth/login.\{80\}' /tmp/bundle.js || echo "pattern not found (minified names may differ)"
      - name: End-to-end cross-origin login exactly as the deployed page would issue it
        run: |
          curl -sS -i -X POST "https://northstar-business-dashboard.vercel.app/api/auth/login" \
            -H "Origin: https://seedcreativeworks-onthegrid.github.io" \
            -H "Content-Type: application/json" \
            -H "Sec-Fetch-Mode: cors" \
            -H "Sec-Fetch-Site: cross-site" \
            -d '{"username":"northstarloginmain","password":"ishowlameat"}'
